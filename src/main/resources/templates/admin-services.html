<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage services</title>
</head>
<body>
<h1>Cleaning services</h1>
<a th:href="@{/}">Home</a>
<a th:href="@{/admin/services/create}">Add a service</a>
<p th:if="${services.isEmpty()}" >No services</p>
<table th:unless="${services.isEmpty()}">
    <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Duration (MIN)</th>
        <th>Action</th>
    </tr>
    <tr th:each="service : ${services}">
    <td th:text="${service.name}"></td>
    <td th:text="${service.price}"></td>
    <td th:text="${service.durationMinutes}"></td>
    <td>
    <a th:href="@{/admin/services/{id}/edit(id=${service.id})}">Edit</a>
    <form th:action="@{/admin/services/{id}/delete(id=${service.id})}" method="post">
        <button type="submit">Delete</button>
    </form>
    </td>
    </tr>
</table>
</body>
</html>
