<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sparkle Clean</title>
</head>
<body>
<h1>Sparkle Clean</h1>
<div th:if="${session.userId == null}">
    <a th:href="@{/login}">Login</a>
    <a th:href="@{/register}">Register</a>
</div>
<div th:if="${session.userId != null}">
    <p th:text="'Welcome back, ' + ${session.username}"></p>
   <a th:href = "@{/services}">Browse services</a>
    <a th:href = "@{/bookings}">My bookings</a>
    <a th:if="${session.role.name() == 'ADMIN'}" th:href="@{/admin/services}">Manage services</a>
    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</div>
</body>
</html>
