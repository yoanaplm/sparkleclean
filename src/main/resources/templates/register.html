<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Create account</h1>
<a th:href="@{/}">Home</a> <a th:href="@{/login}">Already registered? Log in</a>

<form th:action="@{/register}" th:object="${registerDto}" method="post" novalidate>
    <p th:each="message : ${#fields.globalErrors()}" th:text="${message}"></p>

    <div>
        <label for="username">Username</label>
        <input id="username" type="text" th:field="*{username}">
        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
    </div>

    <div>
        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}">
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
    </div>

    <div>
        <label for="password">Password</label>
        <input id="password" type="password" th:field="*{password}">
        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
    </div>

    <div>
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" th:field="*{confirmPassword}">
        <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
    </div>

    <button type="submit">Create account</button>
</form>
</body>
</html>
